<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="64" height="64" fill="none">
  <defs>
    <!-- Outer Brand Emerald Gradient -->
    <linearGradient id="scora_fav_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#056B38" />
      <stop offset="50%" stop-color="#0A8F4D" />
      <stop offset="100%" stop-color="#044E28" />
    </linearGradient>

    <!-- Highlight Gradient for the Spark -->
    <linearGradient id="scora_fav_spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D4F5E0" />
    </linearGradient>

    <!-- Soft Drop Shadow for inner depth -->
    <filter id="scora_fav_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#04331B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Modern Squircle Container -->
  <rect
    x="2"
    y="2"
    width="36"
    height="36"
    rx="11"
    fill="url(#scora_fav_bg)"
    stroke="#10B981"
    stroke-width="1"
    stroke-opacity="0.4"
  />

  <!-- Futuristic Geometric 'S' + Code Spark Symbol -->
  <g filter="url(#scora_fav_glow)">
    <!-- Top Arc of S (Code Bracket Angle) -->
    <path
      d="M26 13.5C26 13.5 24 11 19.5 11C15 11 13 13.5 13 16.5C13 20.5 27 19.5 27 24C27 27.5 24.5 29.5 19.5 29.5C15 29.5 13 27 13 27"
      stroke="url(#scora_fav_spark)"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Central Terminal Chevron Slash Accent -->
    <circle cx="20" cy="20.2" r="1.8" fill="#A7F3D0" />
  </g>

  <!-- Top Right Mini Verification Spark -->
  <circle cx="28.5" cy="11.5" r="1.8" fill="#34D399" />
</svg>
