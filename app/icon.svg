<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Clean White Background Circle with Subtle Border -->
  <circle cx="32" cy="32" r="30" fill="#FFFFFF" stroke="#D1E3D6" stroke-width="2" />
  
  <!-- Group for .S (Dot + Green Letter S) -->
  <g transform="translate(0, 0)">
    <!-- Darker Green Dot #04331B tight against S baseline -->
    <circle cx="16" cy="42" r="4.5" fill="#04331B" />
    
    <!-- Bold Green S #056B38 -->
    <text
      x="22"
      y="46"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="900"
      font-size="40"
      fill="#056B38"
      letter-spacing="-1"
    >S</text>
  </g>
</svg>
